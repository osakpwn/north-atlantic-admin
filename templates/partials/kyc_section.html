{% if success %}
<div style="margin-bottom: 1rem; padding: 1rem; background: #d4edda; color: #155724; border-radius: 8px;">
    KYC data updated successfully!
</div>
{% endif %}

{% if kyc_data %}
<div class="kyc-list">
    {% for kyc in kyc_data %}
    <div class="kyc-card">
        <div class="kyc-header">
            <div>
                <h3>{{ kyc.first_name or '' }} {{ kyc.last_name or '' }}</h3>
                <p style="color: var(--gray); font-size: 0.875rem;">Submitted: {{ kyc.submitted_at[:10] if kyc.submitted_at else 'N/A' }}</p>
            </div>
        </div>
        
        <div class="info-grid">
            <div class="info-item">
                <label>First Name</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="first_name">
                    <input type="text" name="value" value="{{ kyc.first_name or '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
            
            <div class="info-item">
                <label>Last Name</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="last_name">
                    <input type="text" name="value" value="{{ kyc.last_name or '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
            
            <div class="info-item">
                <label>Date of Birth</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="date_of_birth">
                    <input type="date" name="value" value="{{ kyc.date_of_birth if kyc.date_of_birth else '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
            
            <div class="info-item">
                <label>Country</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="country">
                    <input type="text" name="value" value="{{ kyc.country or '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
            
            <div class="info-item">
                <label>Occupation</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="occupation">
                    <input type="text" name="value" value="{{ kyc.occupation or '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
            
            <div class="info-item">
                <label>Source of Funds</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="source_of_funds">
                    <input type="text" name="value" value="{{ kyc.source_of_funds or '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
            
            <div class="info-item">
                <label>Purpose of Account</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="purpose_of_account">
                    <input type="text" name="value" value="{{ kyc.purpose_of_account or '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
            
            <div class="info-item">
                <label>ID Type</label>
                <form hx-post="{{ url_for('views.update_kyc_field', user_id=user_id) }}"
                      hx-target="#tab-content"
                      hx-swap="innerHTML">
                    <input type="hidden" name="field" value="id_type">
                    <input type="text" name="value" value="{{ kyc.id_type or '' }}" onchange="this.form.requestSubmit()">
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div style="text-align: center; padding: 3rem; color: var(--gray);">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto 1rem;">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
    </svg>
    <p>No KYC data found</p>
    <form hx-post="{{ url_for('views.create_kyc', user_id=user_id) }}"
          hx-target="#tab-content"
          hx-swap="innerHTML">
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
            Create KYC Record
        </button>
    </form>
</div>
{% endif %}

<style>
    .kyc-list { display: grid; gap: 1rem; }
    
    .kyc-card {
        background: var(--light-gray);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
    }
    
    .kyc-header {
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
    }
    
    .kyc-header h3 {
        font-size: 1.125rem;
        margin: 0 0 0.25rem 0;
    }
    
    .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
    }
    
    .info-item label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--gray);
        margin-bottom: 0.5rem;
    }
    
    .info-item input,
    .info-item select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.875rem;
    }
    
    .info-item input:focus {
        outline: none;
        border-color: var(--primary);
    }
    
    @media (max-width: 768px) {
        .info-grid { grid-template-columns: 1fr; }
    }
</style>
