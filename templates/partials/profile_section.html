{% if success %}
<div class="success-box" style="margin-bottom: 1rem; padding: 1rem; background: #d4edda; color: #155724; border-radius: 8px;">
    Profile updated successfully!
</div>
{% endif %}

<div class="info-grid">
    <div class="info-item">
        <label>First Name</label>
        <form hx-post="{{ url_for('views.update_profile_field', user_id=user_id) }}"
              hx-target="#tab-content"
              hx-swap="innerHTML">
            <input type="hidden" name="field" value="first_name">
            <input type="text" name="value" value="{{ profile.first_name or '' }}" onchange="this.form.requestSubmit()">
        </form>
    </div>
    
    <div class="info-item">
        <label>Last Name</label>
        <form hx-post="{{ url_for('views.update_profile_field', user_id=user_id) }}"
              hx-target="#tab-content"
              hx-swap="innerHTML">
            <input type="hidden" name="field" value="last_name">
            <input type="text" name="value" value="{{ profile.last_name or '' }}" onchange="this.form.requestSubmit()">
        </form>
    </div>
    
    <div class="info-item">
        <label>Email</label>
        <form hx-post="{{ url_for('views.update_profile_field', user_id=user_id) }}"
              hx-target="#tab-content"
              hx-swap="innerHTML">
            <input type="hidden" name="field" value="email">
            <input type="email" name="value" value="{{ profile.email or '' }}" onchange="this.form.requestSubmit()">
        </form>
    </div>
    
    <div class="info-item">
        <label>Phone</label>
        <form hx-post="{{ url_for('views.update_profile_field', user_id=user_id) }}"
              hx-target="#tab-content"
              hx-swap="innerHTML">
            <input type="hidden" name="field" value="phone">
            <input type="tel" name="value" value="{{ profile.phone or '' }}" onchange="this.form.requestSubmit()">
        </form>
    </div>
    
    <div class="info-item">
        <label>Ticket Number</label>
        <form hx-post="{{ url_for('views.update_profile_field', user_id=user_id) }}"
              hx-target="#tab-content"
              hx-swap="innerHTML">
            <input type="hidden" name="field" value="ticket_no">
            <input type="text" name="value" value="{{ profile.ticket_no or '' }}" onchange="this.form.requestSubmit()">
        </form>
    </div>
    
    <div class="info-item">
        <label>Address</label>
        <form hx-post="{{ url_for('views.update_profile_field', user_id=user_id) }}"
              hx-target="#tab-content"
              hx-swap="innerHTML">
            <input type="hidden" name="field" value="address">
            <textarea name="value" rows="2" onchange="this.form.requestSubmit()">{{ profile.address or '' }}</textarea>
        </form>
    </div>
    

</div>

<style>
    .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
    }
    
    .info-item label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--gray);
        margin-bottom: 0.5rem;
    }
    
    .info-item input,
    .info-item textarea,
    .info-item select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.875rem;
    }
    
    .info-item input:focus,
    .info-item textarea:focus,
    .info-item select:focus {
        outline: none;
        border-color: var(--primary);
    }
    
    .success-box {
        animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
        .info-grid {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        
        .info-item label {
            font-size: 0.8125rem;
            margin-bottom: 0.375rem;
        }
        
        .info-item input,
        .info-item textarea,
        .info-item select {
            padding: 0.625rem;
            font-size: 0.8125rem;
        }
    }
    
    @media (max-width: 480px) {
        .info-grid {
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        
        .info-item label {
            font-size: 0.8rem;
            margin-bottom: 0.3125rem;
        }
        
        .info-item input,
        .info-item textarea,
        .info-item select {
            padding: 0.5625rem;
            font-size: 0.8rem;
        }
        
        .info-item textarea {
            rows: 3;
        }
    }
    
    @media (max-width: 320px) {
        .info-grid {
            gap: 0.5rem;
        }
        
        .info-item input,
        .info-item textarea,
        .info-item select {
            padding: 0.5rem;
            font-size: 0.75rem;
            min-height: 44px;
        }
    }
</style>
