{% extends "base.html" %}

{% block title %}Login - Admin Panel{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #059669 0%, #047857 50%, #065f46 100%);
        padding: 1rem;
    }
    
    .login-box {
        background: white;
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 380px;
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .login-icon {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
    }
    
    .login-header h1 {
        font-size: 1.75rem;
        color: var(--dark);
        margin-bottom: 0.5rem;
    }
    
    .login-header p {
        color: var(--gray);
        font-size: 0.875rem;
    }
    
    .login-box input {
        width: 100%;
        padding: 0.875rem 1rem;
        border: 2px solid var(--border);
        border-radius: 8px;
        font-size: 0.9375rem;
        transition: all 0.2s;
    }
    
    .login-box input:focus {
        outline: none;
        border-color: #059669;
        box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.1);
    }
    
    .login-box button {
        width: 100%;
        padding: 0.875rem;
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }
    
    .login-box button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(5, 150, 105, 0.4);
    }
    
    .login-box button:active {
        transform: translateY(0);
    }
    
    .error-message {
        background: #fee2e2;
        color: #991b1b;
        padding: 0.875rem;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.625rem;
        border-left: 4px solid #ef4444;
    }
    
    .form-group {
        margin-bottom: 1rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--dark);
    }
    
    @media (max-width: 480px) {
        .login-container { padding: 0.5rem; }
        .login-box {
            max-width: 100%;
            padding: 1.5rem;
            margin: 0.5rem;
            border-radius: 12px;
        }
        .login-icon { width: 48px; height: 48px; margin-bottom: 1rem; }
        .login-header h1 { font-size: 1.5rem; }
        .login-box input {
            padding: 0.875rem;
            font-size: 16px;
            min-height: 44px;
        }
        .login-box button {
            padding: 0.875rem;
            font-size: 1rem;
            min-height: 44px;
        }
    }
</style>
{% endblock %}

{% block login_content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="login-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Admin Panel</h1>
            <p>Enter password to continue</p>
        </div>
        
        {% if error %}
        <div class="error-message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 0.5rem;">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Password
                </label>
                <input type="password" name="password" required autofocus placeholder="Enter password" autocomplete="current-password">
            </div>
            
            <button type="submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
